// ---------- fechas ----------
function todayKey(){const d=new Date();return fmt(d)}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parse(k);d.setDate(d.getDate()+n);return fmt(d)}
function dow(k){return (parse(k).getDay()+6)%7}
function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function monday(k){return addDays(k,-dow(k))}
function phaseOf(k){return PHASES.find(p=>k>=p.from&&k<=p.to)||(k<PHASES[0].from?PHASES[0]:PHASES[PHASES.length-1])}
function longDate(k){const t=parse(k).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});return t.charAt(0).toUpperCase()+t.slice(1)}

function planFor(k){
  if(OV[k]) return Object.assign({tag:"Semana de inicio"},OV[k]);
  const ph = phaseOf(k), q = Q[ph.id], d = dow(k);
  const order = ["rest","tue","str","thu","fri","sat","sun"]; // plantilla con fuerza en miércoles
  let slots = order.slice();
  const sd = settings.strDay;
  if(sd!==2){ const tmp=slots[sd]; slots[sd]="str"; slots[2]=tmp; }
  const slot = slots[d];
  const toRace = diffDays(k,RACE);
  let f = 1, tag = "";
  const wk = Math.floor(diffDays(START,k)/7);
  if(toRace>=0 && toRace<=13){f = toRace<=6?0.5:0.65; tag="Afinado";}
  else if(ph.id==="reinc"){f=REINC_F[wk]||1; tag= wk===3?"Semana de descarga":"Vuelta progresiva · semana "+(wk+1);}
  else if(wk>=0 && wk%4===3){f=0.65; tag="Semana de descarga";}
  else if(wk===4){f=0.9; tag="Entrada en base";}
  const place = d<=3 ? (k<DST?"Rodillo":"Rodillo o exterior") : "Exterior";
  if(slot==="rest") return {kind:"rest",t:"Descanso",m:0,z:"Z1",zones:[],d:"Descanso total o 15' de movilidad. Aquí se asimila el entrenamiento.",tag};
  if(ph.id==="reinc" && wk===3 && slot==="thu") return {key:"ramp",kind:"ride",t:"Re-test rampa",m:40,z:"Z5",zones:["Z2"],d:"Mismo test que el primer día: 100 W y +20 W por minuto hasta no poder. FTP ≈ 75% de tu mejor minuto. Actualízalo en Ajustes para la fase de base.",tag,place};
  if(slot==="str"){
    const s = STR[ph.id];
    if(toRace>=0 && toRace<=10) return {kind:"rest",t:"Descanso (sin fuerza)",m:0,z:"Z1",zones:[],d:"A menos de 10 días de la carrera no se hace fuerza.",tag};
    return {kind:"str",t:"Fuerza · "+s.title,m:ph.id==="reinc"||ph.id==="pre"?40:50,z:"str",zones:[],d:s.note,tag,place:"Gimnasio en casa"};
  }
  const base = q[slot];
  if(base.rest) return {kind:"rest",t:"Descanso",m:0,z:"Z1",zones:[],d:"Descanso antes del test y del fin de semana.",tag};
  const fixed = /test/i.test(base.t);
  return {kind:"ride",t:base.t,m:fixed?base.m:Math.round(base.m*f/5)*5,z:base.z,zones:base.zones,d:base.d,tag,place,key:ph.id+"."+slot,f};
}

function dur(sec){return sec%60===0?(sec/60)+"m":sec+"s"}
function workoutText(p){
  if(!p.key) return "";
  if(p.key==="ramp"){
    let t="Calentamiento\n- 10m ramp 45-60%\n- 3m 50%\n\nRampa: sigue hasta no poder más\n";
    for(let w=100;w<=500;w+=20) t+="- 1m "+w+"w\n";
    return t+"\nVuelta a la calma\n- 5m 40%";
  }
  const tp = WT[p.key]; if(!tp) return "";
  const f = p.f||1;
  let rn = tp.rep?tp.rep.n:0, on = tp.outer?tp.outer.n:0;
  if(f<1){ if(tp.outer) on=Math.max(1,Math.round(on*f)); else if(tp.rep) rn=Math.max(1,Math.round(rn*f)); }
  const stepSec = tp.rep?tp.rep.steps.reduce((s,x)=>s+x[0],0):0;
  const setSec = tp.outer? on*(rn*stepSec+tp.outer.rest[0]) : rn*stepSec;
  const F = Math.max(0, Math.round(p.m - tp.wu - tp.cd - setSec/60));
  let t = "Calentamiento\n- "+tp.wu+"m ramp 50-70%\n\n";
  if(F>0) t += "Fondo Z2\n- "+F+"m 65-72%\n\n";
  if(tp.rep){
    const block = rn+"x\n"+tp.rep.steps.map(x=>"- "+dur(x[0])+" "+x[1]).join("\n")+"\n";
    if(tp.outer){ for(let i=0;i<on;i++) t += "Serie "+(i+1)+"\n"+block+"\nRecuperación\n- "+dur(tp.outer.rest[0])+" "+tp.outer.rest[1]+"\n\n"; }
    else t += "Bloque principal\n"+block+"\n";
  }
  return t + "Vuelta a la calma\n- "+tp.cd+"m ramp 60-45%";
}
function level(p){ if(p.kind!=="ride"||p.m<60) return "bajo"; if(p.m<=150) return "medio"; return "alto"; }
function targets(p){
  const kg = curKg(), lv = level(p);
  let cho = p.kind==="rest"? 2 : lv==="bajo"? (p.kind==="str"?4:3) : lv==="medio"? (p.m<=75?5:6) : (p.m>=210?8:7);
  const pro = 2.2, fat = lv==="bajo"?0.9:1.0;
  const c=Math.round(cho*kg), pr=Math.round(pro*kg), fa=Math.round(fat*kg);
  return {cho,c,pr,fa,kcal:Math.round(c*4+pr*4+fa*9),lv};
}

const IF_Z={Z1:.5,Z2:.65,Z3:.8,Z4:.9,Z5:1,str:.4};

function fmtDur(s){s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
function actFrom(a){return {id:a.id,name:a.name||"Salida",start:a.start_date_local||"",type:a.type,mov:a.moving_time||a.elapsed_time||0,dist:a.distance||0,spd:(a.average_speed||0)*3.6,maxspd:(a.max_speed||0)*3.6,hr:a.average_heartrate||null,maxhr:a.max_heartrate||null,cad:a.average_cadence||null,w:a.icu_average_watts||a.average_watts||null,np:a.icu_weighted_avg_watts||null,load:a.icu_training_load??null,IF:a.icu_intensity||null,ef:a.icu_efficiency_factor||null,vi:a.icu_variability_index||null,kcal:a.calories||null,kj:a.icu_joules?Math.round(a.icu_joules/1000):null,elev:a.total_elevation_gain||0,ftp:a.icu_ftp||null,zones:(a.icu_zone_times||[]).filter(z=>/^Z\d$/.test(z.id)).map(z=>z.secs||0),hrz:a.icu_hr_zone_times||[]}}
function best(arr,win){if(arr.length<win)return 0;let s=0,m=0;for(let i=0;i<arr.length;i++){s+=(arr[i]||0);if(i>=win)s-=(arr[i-win]||0);if(i>=win-1&&s>m)m=s}return m/win}
function allActs(){const out=[];Object.values(logs).forEach(L=>{((L&&L.acts)||[]).forEach(a=>out.push(Object.assign({day:L.date},a)))});return out.sort((x,y)=>x.start<y.start?-1:1)}

function compareHTML(k,a){
  const t=planFor(k).t;
  const same=allActs().filter(x=>x.id!==a.id&&x.day<k&&(planFor(x.day).t===t||x.name===a.name)).slice(-5);
  if(!same.length) return '<p class="muted" style="font-size:13px;margin:0">Cuando repitas este tipo de entreno, aquí verás la comparación con los anteriores.</p>';
  const rows=same.concat([Object.assign({day:k},a)]), maxEf=Math.max(...rows.map(r=>r.ef||0))||1;
  let h='<div><span class="lbl">Comparado con entrenos parecidos</span><div class="chart"><table class="cmp"><thead><tr><th>Fecha</th><th>Tiempo</th><th>W</th><th>NP</th><th>FC</th><th>Vatios/pulso</th></tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr'+(r.id===a.id?' class="me"':'')+'><td>'+r.day.slice(8)+'/'+r.day.slice(5,7)+'</td><td>'+Math.round(r.mov/60)+"'</td><td>"+(r.w?Math.round(r.w):"–")+'</td><td>'+(r.np?Math.round(r.np):"–")+'</td><td>'+(r.hr?Math.round(r.hr):"–")+'</td><td><div class="efbar"><span style="width:'+((r.ef||0)/maxEf*100).toFixed(0)+'%"></span><b>'+(r.ef?r.ef.toFixed(2):"–")+'</b></div></td></tr>'});
  h+='</tbody></table></div>';

    h+='<p class="muted" style="font-size:13px;margin:6px 0 0">'+(d>=1?'Hoy produces <b style="color:var(--ok)">'+d.toFixed(1)+'% más vatios por pulsación</b> que la última vez: tu base aeróbica mejora.':d<=-1?'Hoy produces <b style="color:var(--warn)">'+Math.abs(d).toFixed(1)+'% menos vatios por pulsación</b> que la última vez. Suele deberse a cansancio, calor o poco sueño.':'Eficiencia parecida a la última vez.')+'</p>'}
  return h+'</div>';
}

function down(data,n){const L=data.length;if(L<=n)return data.slice();const out=[],b=L/n;for(let i=0;i<n;i++){let s=0,c=0;for(let j=Math.floor(i*b);j<Math.floor((i+1)*b);j++){const v=data[j];if(v!=null){s+=v;c++}}out.push(c?s/c:null)}return out}
function streamSVG(data,label,unit,color,isAlt){
  const W=640,H=100,pt=20,pb=4; const d=down(data,400), vals=d.filter(v=>v!=null); if(!vals.length) return "";
  let mn=isAlt?Math.min(...vals):0, mx=Math.max(...vals); if(mx===mn) mx=mn+1;
  const X=i=>i/Math.max(d.length-1,1)*W, Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  let line=""; d.forEach((v,i)=>{if(v==null)return;line+=(line?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)});
  const raw=data.filter(v=>v!=null), avg=raw.reduce((s,v)=>s+v,0)/raw.length, rmax=Math.max(...raw);
  return '<div class="sc"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" width="100%" height="'+H+'" role="img" aria-label="'+label+'"><path d="'+line+' L'+W+' '+(H-pb)+' L0 '+(H-pb)+' Z" fill="'+color+'" opacity=".16"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="sclbl"><b style="color:'+color+'">'+label+'</b> · media '+(unit==="km/h"?avg.toFixed(1):Math.round(avg))+' '+unit+' · máx '+(unit==="km/h"?rmax.toFixed(1):Math.round(rmax))+'</div><div class="cursor"></div></div>';
}
function bindReadout(i,time,used){
  const ch=document.getElementById("ch"+i), ro=document.getElementById("ro"+i); if(!ch||!ro||!used.length) return;
  const n=used[0][1].length;
  const move=e=>{const r=ch.getBoundingClientRect(), x=Math.min(Math.max((e.clientX-r.left)/r.width,0),1), idx=Math.round(x*(n-1));
    ch.querySelectorAll(".cursor").forEach(c=>{c.style.left=(x*100)+"%";c.style.display="block"});
    ro.innerHTML='<b>'+fmtDur(time[idx]!=null?time[idx]:idx)+'</b> · '+used.map(([d,data])=>{const v=data[idx];return '<span style="color:'+d[3]+'">'+(v==null?"–":(d[2]==="km/h"?v.toFixed(1):Math.round(v)))+' '+d[2]+'</span>'}).join(" · ")};
  ch.addEventListener("pointermove",move); ch.addEventListener("pointerdown",move);
}
function loadLeaflet(){if(window.L&&window.L.map)return Promise.resolve();return new Promise((res,rej)=>{const c=document.createElement("link");c.rel="stylesheet";c.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(c);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function drawMap(id,lat,lng){
  loadLeaflet().then(()=>{const Lf=window.L, pts=[];for(let j=0;j<lat.length;j+=3){if(lat[j]!=null&&lng[j]!=null)pts.push([lat[j],lng[j]])}
    const el=document.getElementById(id); if(!el||pts.length<2) return;
    const m=Lf.map(el,{zoomControl:true});Lf.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(m);
    const pl=Lf.polyline(pts,{color:"#d64570",weight:3}).addTo(m);m.fitBounds(pl.getBounds(),{padding:[14,14]});
    Lf.circleMarker(pts[0],{radius:6,color:"#2e8b57",fillColor:"#2e8b57",fillOpacity:1}).addTo(m);Lf.circleMarker(pts[pts.length-1],{radius:6,color:"#16201b",fillColor:"#16201b",fillOpacity:1}).addTo(m);
  }).catch(()=>{const el=document.getElementById(id);if(el)el.innerHTML='<p class="muted" style="padding:8px">No se pudo cargar el mapa.</p>'});
}
async function loadDetail(k,i){

  box.innerHTML='<p class="muted">Cargando tu entreno segundo a segundo…</p>';
  try{
    const [st,iv]=await Promise.all([ivGet("activity/"+a.id+"/streams?types=time,watts,heartrate,cadence,velocity_smooth,altitude,latlng"),ivGet("activity/"+a.id+"/intervals").catch(()=>null)]);
    const S={}; (st||[]).forEach(s=>S[s.type]=s);
    const time=(S.time&&S.time.data)||[];
    const defs=[["watts","Potencia","W","#7b5cd6"],["heartrate","Pulso","ppm","#d64570"],["cadence","Cadencia","rpm","#c04fb9"],["velocity_smooth","Velocidad","km/h","#2f7fc1",3.6],["altitude","Altitud","m","#7d8a83"]];
    const used=[]; let charts="";
    defs.forEach(d=>{const s=S[d[0]]; if(!s||!s.data||!s.data.some(v=>v)) return; const data=d[4]?s.data.map(v=>v==null?null:v*d[4]):s.data; used.push([d,data]); charts+=streamSVG(data,d[1],d[2],d[3],d[0]==="altitude")});
    let h='';
    if(used.length) h+='<div class="readout" id="ro'+i+'">Toca o desliza el dedo por las gráficas para ver cada segundo</div><div class="charts" id="ch'+i+'">'+charts+'</div><div class="taxis"><span>0:00</span><span>'+fmtDur((time[time.length-1]||a.mov)/2)+'</span><span>'+fmtDur(time[time.length-1]||a.mov)+'</span></div>';
    const ll=S.latlng, hasMap=ll&&ll.data&&ll.data2&&ll.data.some(v=>v);
    if(hasMap) h+='<div><span class="lbl">Ruta</span><div class="map" id="map'+i+'"></div></div>';

    if(ints.length) h+='<div><span class="lbl">Intervalos</span><div class="chart"><table class="cmp"><thead><tr><th>#</th><th>Tiempo</th><th>W</th><th>FC</th><th>Zona</th></tr></thead><tbody>'+ints.map((x,j)=>'<tr><td>'+(j+1)+'</td><td>'+fmtDur(x.moving_time)+'</td><td>'+(x.average_watts?Math.round(x.average_watts):"–")+'</td><td>'+(x.average_heartrate?Math.round(x.average_heartrate):"–")+'</td><td>'+(x.zone?'<span class="zchip" style="background:'+ZCOL[Math.min(x.zone,7)-1]+'">Z'+x.zone+'</span>':"–")+'</td></tr>').join("")+'</tbody></table></div></div>';

    if(hasMap) drawMap("map"+i,ll.data,ll.data2);
    if(!a.pb&&S.watts){const acts=(getLog(k).acts||[]).slice();acts[i]=Object.assign({},acts[i],{pb:bests(S.watts.data||[])});setLog(k,{acts});autoFTP()}
  }catch(e){box.innerHTML='<p class="muted">No se pudieron cargar las gráficas ('+esc(e.message)+'). Revisa la clave en Semana → Avanzado.</p>'}

async function syncIV(auto){
  if(!IV.id||!IV.key){ if(!auto){ syncNote="Añade tu ID y clave en Semana → Avanzado."; render(); } return; }
  syncNote="Sincronizando…"; if(!auto) render();
  try{
    const list=await ivGet("athlete/"+encodeURIComponent(IV.id)+"/activities?oldest="+addDays(todayKey(),-90)+"&newest="+addDays(todayKey(),1));
    const byDay={};
    (list||[]).filter(a=>/ride/i.test(a.type||"")).forEach(a=>{const k=(a.start_date_local||"").slice(0,10);if(k)(byDay[k]=byDay[k]||[]).push(actFrom(a))});

      const acts=byDay[k].sort((x,y)=>x.start<y.start?-1:1).map(a=>{const o=prev.find(p=>p.id===a.id);return (o&&o.pb)?Object.assign(a,{pb:o.pb}):a});
      setLog(k,{acts,done:true,min:Math.round(acts.reduce((s,a)=>s+a.mov,0)/60)}); n+=acts.length});
    // mejor potencia de 20' de cada salida, para el análisis automático del FTP
    let c=0;
    for(const k of Object.keys(byDay).sort().reverse()){
      const acts=(getLog(k).acts||[]).slice(); let ch=false;
      for(let j=0;j<acts.length;j++){const a=acts[j]; if(a.pb||!a.w||c>=12) continue;

  }catch(e){ syncNote=(e.message==="http 401"||e.message==="http 403")?"Clave o ID incorrectos.":"No se pudo sincronizar. Revisa la conexión."; }

const PBW=[[5,"5 s"],[30,"30 s"],[60,"1 min"],[300,"5 min"],[1200,"20 min"],[3600,"1 h"],[7200,"2 h"]];
function bests(w){const o={};PBW.forEach(([s])=>{const b=best(w,s);if(b>0)o[s]=Math.round(b)});return o}
function fmtDay(k){return k.slice(8)+"/"+k.slice(5,7)}
function curKg(){

  const rec=xs.filter(l=>diffDays(l.date,t)<14);
  if(rec.length) return rec.reduce((s,l)=>s+l.peso,0)/rec.length;

function isIndoor(a){return a.type==="VirtualRide"||/rodillo|zwift|indoor|trainer|virtual/i.test(a.name||"")||(planFor(a.day).place==="Rodillo"&&(a.elev||0)<30)}
function autoFTP(){
  const t=todayKey(), hist=settings.ftpHist||[];
  const acts=allActs().filter(a=>a.pb&&diffDays(a.day,t)>=0&&diffDays(a.day,t)<=42);
  let cand=null, why="", src="auto";
  const tests=acts.filter(a=>a.pb[60]&&(/rampa|ramp/i.test(a.name||"")||/rampa/i.test(planFor(a.day).t)));
  const lastTest=tests[tests.length-1];
  if(lastTest&&!hist.some(h=>h.src===lastTest.id)){cand=Math.round(lastTest.pb[60]*0.75);why="test de rampa del "+fmtDay(lastTest.day)+" (75 % de tu mejor minuto: "+lastTest.pb[60]+" W)";src=lastTest.id}
  else{
    const est=acts.filter(a=>a.pb[1200]).map(a=>Math.max(a.pb[1200]*0.95,a.pb[3600]||0)).sort((x,y)=>y-x);
    if(est.length>=2&&est[1]>=settings.ftp+3){cand=Math.round(est[1]);why="dos salidas de las últimas 6 semanas por encima de tu FTP"}
  }
  if(cand!=null&&cand!==settings.ftp&&cand>80){
    const old=settings.ftp; settings.ftp=cand; settings.ftpExample=false;
    settings.ftpHist=hist.concat([{date:t,ftp:cand,src}]);
    settings.ftpNote={date:t,old,ftp:cand,why,seen:false}; saveSettings();
  }
}

  const pts=all.filter(l=>typeof l.peso==="number").slice(-90);
  if(pts.length<2) return '<section class="card"><span class="lbl">Peso</span><p class="muted" style="margin:0">Apunta tu peso en ayunas en la pestaña Día: con dos registros aparece la gráfica.</p></section>';
  const W=640,H=180,pl=40,pr=14,pt=14,pb=24, ys=pts.map(p=>p.peso), mn=Math.floor(Math.min(...ys)-0.5), mx=Math.ceil(Math.max(...ys)+0.5);
  const t0=parse(pts[0].date).getTime(), t1=parse(pts[pts.length-1].date).getTime();
  const X=d=>pl+(parse(d).getTime()-t0)/((t1-t0)||1)*(W-pl-pr), Y=v=>pt+(mx-v)/((mx-mn)||1)*(H-pt-pb);
  let g=''; for(let v=mn;v<=mx;v++) g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">'+v+'</text>';
  const line=pts.map((p,i)=>(i?"L":"M")+X(p.date).toFixed(1)+" "+Y(p.peso).toFixed(1)).join(" ");
  g+='<path d="'+line+' L'+X(pts[pts.length-1].date).toFixed(1)+' '+(H-pb)+' L'+X(pts[0].date).toFixed(1)+' '+(H-pb)+' Z" fill="var(--pine)" opacity=".1"/><path d="'+line+'" fill="none" stroke="var(--pine)" stroke-width="2.5"/>';
  const ch=(pts[pts.length-1].peso-pts[0].peso);
  return '<section class="card"><span class="lbl">Peso</span><div class="kpis">'+kpi(pts[pts.length-1].peso.toFixed(1),"kg","Último")+kpi(curKg().toFixed(1),"kg","Media 14 días")+kpi((ch>0?"+":"")+ch.toFixed(1),"kg","Desde "+fmtDay(pts[0].date))+'</div><div class="chart"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:320px" role="img" aria-label="Peso">'+g+'</svg></div><p class="muted" style="font-size:13px;margin:0">Mira la tendencia, no el día a día: el agua y el glucógeno mueven ±1 kg. Objetivo: 0,3–0,4 kg menos por semana.</p></section>';
}
function ftpHistHTML(){
  const hs=(settings.ftpHist||[]); if(hs.length<2) return "";
  return '<div class="ftphist">'+hs.slice(-6).map(h=>'<span><b class="num">'+h.ftp+'</b> W <span class="muted">'+fmtDay(h.date)+'</span></span>').join('<span class="muted">→</span>')+'</div>';
}
function renderProgreso(){
  const t=todayKey(), acts=allActs(), all=Object.values(logs).filter(l=>l&&l.date).sort((a,b)=>a.date<b.date?-1:1), kg=curKg();
  const sumW=w=>{const e=addDays(w,6),xs=acts.filter(a=>a.day>=w&&a.day<=e);return {h:xs.reduce((s,a)=>s+a.mov,0)/3600,km:xs.reduce((s,a)=>s+a.dist,0)/1000,el:xs.reduce((s,a)=>s+(a.elev||0),0),tss:xs.reduce((s,a)=>s+(a.load||0),0)}};
  const cw=sumW(monday(t)), pw=sumW(addDays(monday(t),-7));
  let h='<div style="display:flex;flex-direction:column;gap:16px">';
  h+=ftpBanner();
  h+='<section class="card"><span class="lbl">Esta semana · frente a la anterior</span><div class="kpis k4">'+kpi(cw.h.toFixed(1),"h","Horas",deltaTag(cw.h,pw.h,true))+kpi(Math.round(cw.km),"km","Distancia",deltaTag(cw.km,pw.km))+kpi(Math.round(cw.el),"m","Desnivel",deltaTag(cw.el,pw.el))+kpi(Math.round(cw.tss),"","Carga",deltaTag(cw.tss,pw.tss))+'</div></section>';
  h+='<section class="card"><span class="lbl">Tu motor</span><div class="kpis">'+kpi(settings.ftp,"W","FTP · automático")+kpi((settings.ftp/kg).toFixed(2),"W/kg","FTP por kilo")+kpi(kg.toFixed(1),"kg","Peso · media 14 d")+'</div>'+ftpHistHTML()+'<p class="muted" style="font-size:13px;margin:0">El FTP se ajusta solo: con cada test de rampa (75 % de tu mejor minuto) o cuando dos salidas de las últimas 6 semanas lo superan (95 % de tu mejor 20 minutos). Los W/kg son la clave para subir puertos en la Urbión y la QH.</p></section>';
  h+=powerCurveHTML(acts,kg);
  h+=volumeHTML(acts);
  h+=powerEvoHTML(acts);
  h+=zonesWeeklyHTML(acts);
  h+=pmcHTML();
  h+=historialHTML();
  h+=weightHTML(all);
  if(!acts.length) h+='<section class="card"><p class="muted" style="margin:0">Configura intervals.icu en Semana → Avanzado y pulsa Sincronizar en la pestaña Día: aquí aparecerá el análisis de todas tus salidas.</p></section>';
  h+='</div>';
  $view.innerHTML=h;
  $view.querySelectorAll(".hrow").forEach(b=>b.onclick=()=>{cur=b.dataset.k;setView("hoy")});
  bindFtpBanner();
}

function render(){
  const ph = phaseOf(todayKey());
  document.getElementById("phasePill").textContent = ph.name;
  document.getElementById("daysLeft").textContent = Math.max(0,diffDays(todayKey(),RACE));
  ({hoy:renderHoy,semana:renderSemana,fuerza:renderFuerza,progreso:renderProgreso,mes:renderMes,dieta:renderDieta})[view]();
}
function setView(v){view=v;document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v?"true":"false"));render();window.scrollTo(0,0)}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>setView(b.dataset.v));

// ---------- carga local inmediata ----------
(function loadLocal(){
  const s=lsGet("ep-settings"); if(s) settings=Object.assign({},DEFAULT_SET,migrate(Object.assign({},s)));
  loadIV();
  (lsGet("ep-index")||[]).forEach(id=>{const v=lsGet("ep-"+id); if(v) logs[id]=v;});
})();
render();
flash("Guardado en este teléfono");
if(IV.id&&IV.key) syncIV(true);

// ---------- intervals.icu (opcional) ----------
function loadIV(){ try{ const v=JSON.parse(localStorage.getItem("ep-iv")||"null"); if(v){IV.id=v.id||"";IV.key=v.key||"";} }catch(e){} }
function saveIV(id,key){ IV.id=id.trim(); IV.key=key.trim(); try{localStorage.setItem("ep-iv",JSON.stringify({id:IV.id,key:IV.key}))}catch(e){} }
async function sendToIntervals(k){
  const p=planFor(k), txt=workoutText(p);
  if(!IV.id||!IV.key) throw new Error("config");
  const r=await fetch("https://intervals.icu/api/v1/athlete/"+encodeURIComponent(IV.id)+"/events",{
    method:"POST",
    headers:{"Authorization":"Basic "+btoa("API_KEY:"+IV.key),"Content-Type":"application/json"},
    body:JSON.stringify({category:"WORKOUT",type:"Ride",start_date_local:k+"T07:00:00",name:p.t,description:txt})
  });
  if(!r.ok) throw new Error("http "+r.status);
  return r.json();
}
})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}

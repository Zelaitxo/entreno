:root[data-theme="dark"]{

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.wday:first-child{border-top:0}

.bar{height:6px;border-radius:3px;background:var(--z2)}

.status.done{background:var(--ok);border-color:var(--ok)}
.ex{display:grid;grid-template-columns:auto 1fr 84px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}

.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px;text-align:center}
.stat .num{font-size:20px;display:block}
.chart{overflow-x:auto}
.mbar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:10px 0 6px;background:var(--surface-2)}
.mbar span{display:block;height:100%}

.mleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.mes-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.mes-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.md{min-height:58px;border-radius:8px;padding:5px 4px;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;color:var(--fg);font:inherit}
.md.out{opacity:.35}
.md.today{outline:2px solid var(--ember);outline-offset:-2px}
.md .n{font-family:var(--mono);font-weight:600;font-size:13px}
.md .mins{font-size:11px;color:var(--muted);font-family:var(--mono)}
.md .ck{color:var(--pine);font-weight:700}

.save{font-size:12px;color:var(--muted)}
.phases{display:flex;flex-direction:column;gap:8px}
.ph{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.ph.now{outline:2px solid var(--pine)}
@media (max-width:420px){.macros{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>

function todayKey(){const d=new Date();return fmt(d)}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}

function monday(k){return addDays(k,-dow(k))}
function phaseOf(k){return PHASES.find(p=>k>=p.from&&k<=p.to)||(k<PHASES[0].from?PHASES[0]:PHASES[PHASES.length-1])}

function planFor(k){
  if(OV[k]) return Object.assign({tag:"Semana de inicio"},OV[k]);
  const ph = phaseOf(k), q = Q[ph.id], d = dow(k);
  const order = ["rest","tue","str","thu","fri","sat","sun"]; // plantilla con fuerza en miércoles
  let slots = order.slice();
  const sd = settings.strDay;
  if(sd!==2){ const tmp=slots[sd]; slots[sd]="str"; slots[2]=tmp; }
  const slot = slots[d];
  const toRace = diffDays(k,RACE);
  let f = 1, tag = "";
  const wk = Math.floor(diffDays(START,k)/7);
  if(toRace>=0 && toRace<=13){f = toRace<=6?0.5:0.65; tag="Afinado";}
  else if(ph.id==="reinc"){f=REINC_F[wk]||1; tag= wk===3?"Semana de descarga":"Vuelta progresiva · semana "+(wk+1);}
  else if(wk>=0 && wk%4===3){f=0.65; tag="Semana de descarga";}
  else if(wk===4){f=0.9; tag="Entrada en base";}
  const place = d<=3 ? (k<DST?"Rodillo":"Rodillo o exterior") : "Exterior";
  if(slot==="rest") return {kind:"rest",t:"Descanso",m:0,z:"Z1",zones:[],d:"Descanso total o 15' de movilidad. Aquí se asimila el entrenamiento.",tag};
  if(ph.id==="reinc" && wk===3 && slot==="thu") return {key:"ramp",kind:"ride",t:"Re-test rampa",m:40,z:"Z5",zones:["Z2"],d:"Mismo test que el primer día: 100 W y +20 W por minuto hasta no poder. FTP ≈ 75% de tu mejor minuto. Actualízalo en Ajustes para la fase de base.",tag,place};
  if(slot==="str"){
    const s = STR[ph.id];
    if(toRace>=0 && toRace<=10) return {kind:"rest",t:"Descanso (sin fuerza)",m:0,z:"Z1",zones:[],d:"A menos de 10 días de la carrera no se hace fuerza.",tag};
    return {kind:"str",t:"Fuerza · "+s.title,m:ph.id==="reinc"||ph.id==="pre"?40:50,z:"str",zones:[],d:s.note,tag,place:"Gimnasio en casa"};
  }
  const base = q[slot];
  if(base.rest) return {kind:"rest",t:"Descanso",m:0,z:"Z1",zones:[],d:"Descanso antes del test y del fin de semana.",tag};
  const fixed = /test/i.test(base.t);
  return {kind:"ride",t:base.t,m:fixed?base.m:Math.round(base.m*f/5)*5,z:base.z,zones:base.zones,d:base.d,tag,place,key:ph.id+"."+slot,f};
}

function dur(sec){return sec%60===0?(sec/60)+"m":sec+"s"}
function workoutText(p){
  if(!p.key) return "";
  if(p.key==="ramp"){
    let t="Calentamiento\n- 10m ramp 45-60%\n- 3m 50%\n\nRampa: sigue hasta no poder más\n";
    for(let w=100;w<=500;w+=20) t+="- 1m "+w+"w\n";
    return t+"\nVuelta a la calma\n- 5m 40%";
  }
  const tp = WT[p.key]; if(!tp) return "";
  const f = p.f||1;
  let rn = tp.rep?tp.rep.n:0, on = tp.outer?tp.outer.n:0;
  if(f<1){ if(tp.outer) on=Math.max(1,Math.round(on*f)); else if(tp.rep) rn=Math.max(1,Math.round(rn*f)); }
  const stepSec = tp.rep?tp.rep.steps.reduce((s,x)=>s+x[0],0):0;
  const setSec = tp.outer? on*(rn*stepSec+tp.outer.rest[0]) : rn*stepSec;
  const F = Math.max(0, Math.round(p.m - tp.wu - tp.cd - setSec/60));
  let t = "Calentamiento\n- "+tp.wu+"m ramp 50-70%\n\n";
  if(F>0) t += "Fondo Z2\n- "+F+"m 65-72%\n\n";
  if(tp.rep){
    const block = rn+"x\n"+tp.rep.steps.map(x=>"- "+dur(x[0])+" "+x[1]).join("\n")+"\n";
    if(tp.outer){ for(let i=0;i<on;i++) t += "Serie "+(i+1)+"\n"+block+"\nRecuperación\n- "+dur(tp.outer.rest[0])+" "+tp.outer.rest[1]+"\n\n"; }
    else t += "Bloque principal\n"+block+"\n";
  }
  return t + "Vuelta a la calma\n- "+tp.cd+"m ramp 60-45%";
}
function level(p){ if(p.kind!=="ride"||p.m<60) return "bajo"; if(p.m<=150) return "medio"; return "alto"; }
function targets(p){
  const kg = settings.peso, lv = level(p);
  let cho = p.kind==="rest"? 2 : lv==="bajo"? (p.kind==="str"?4:3) : lv==="medio"? (p.m<=75?5:6) : (p.m>=210?8:7);
  const pro = 2.2, fat = lv==="bajo"?0.9:1.0;
  const c=Math.round(cho*kg), pr=Math.round(pro*kg), fa=Math.round(fat*kg);
  return {cho,c,pr,fa,kcal:Math.round(c*4+pr*4+fa*9),lv};
}

const IF_Z={Z1:.5,Z2:.65,Z3:.8,Z4:.9,Z5:1,str:.4};
function loadDay(k){const L=getLog(k),p=planFor(k);if(!p.m||p.kind==="rest"||!L.done)return{min:0,tss:0};const mins=L.min>0?L.min:p.m;const IF=IF_Z[p.z]||.65;return{min:mins,tss:mins*IF*IF/60*100}}
function pmc(from,to){let ctl=0,atl=0;const out=[];for(let k=from;parse(k)<=parse(to);k=addDays(k,1)){const t=loadDay(k).tss;ctl+=(t-ctl)/42;atl+=(t-atl)/7;out.push({k,ctl,atl,tsb:ctl-atl})}return out}
function ftpAdvice(){
  const today=todayKey(); const recent=(settings.p20||[]).filter(e=>{const d=diffDays(e.date,today);return d>=0&&d<=42});
  if(!recent.length) return {est:null,msg:"Sin datos de los últimos 42 días. Lo reviso con tus próximos entrenos de intervals.icu."};
  const best=Math.max(...recent.map(e=>e.w)); const est=Math.round(best*.95);
  if(est>=settings.ftp+5) return {est,msg:"Tu potencia sugiere un FTP de unos "+est+" W, por encima de los "+settings.ftp+" W. Confírmalo con un segundo test antes de subir."};
  if(est<=settings.ftp-8) return {est,msg:"Tu forma reciente sugiere unos "+est+" W, por debajo de tu FTP. Mantén el FTP y vigila la fatiga antes de subir cargas."};
  return {est,msg:"Tu FTP de "+settings.ftp+" W está bien: tu mejor 20' reciente da unos "+est+" W. No lo subas todavía."};
}

  g+='<path d="'+path("atl")+'" fill="none" stroke="var(--ember)" stroke-width="2"/>';

  h+='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:320px" role="img" aria-label="Carga CTL ATL TSB">'+g+'</svg></div>';

    b+='<text x="'+(x+ww/2)+'" y="'+(H2-6)+'" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--mono)">'+w.k.slice(8)+'/'+w.k.slice(5,7)+'</text>'});

function renderMes(){
  const first=cur.slice(0,8)+"01", mon0=monday(first), mRef=first.slice(0,7);

    const k=addDays(mon0,i), inM=k.slice(0,7)===mRef, p=planFor(k), L=getLog(k);
    if(inM){planM+=p.m||0; if(L.done) doneM+=p.m||0;}
    const bg = (p.kind==="rest"||!p.m) ? "var(--surface-2)" : p.kind==="str" ? "rgba(200,100,28,.22)" : (p.z==="Z3"||p.z==="SS") ? "rgba(214,176,74,.30)" : (p.z==="Z4"||p.z==="Z5") ? "rgba(200,100,28,.38)" : "rgba(31,95,69,.18)";
    cells+='<button class="md'+(inM?"":" out")+(k===todayKey()?" today":"")+'" data-k="'+k+'" style="background:'+bg+'" aria-label="'+esc(longDate(k))+'"><span class="n">'+parse(k).getDate()+(L.done?' <span class="ck">✓</span>':'')+'</span><span class="mins">'+(p.m?Math.floor(p.m/60)+"h"+String(p.m%60).padStart(2,"0"):"")+'</span></button>';
  }
  const mName=parse(first).toLocaleDateString("es-ES",{month:"long",year:"numeric"}).replace(/ De /g," de ");
  let h='<div style="display:flex;flex-direction:column;gap:16px">';
  h+='<div class="daynav"><button id="mp" aria-label="Mes anterior">‹</button><div style="text-align:center"><div class="lbl">Calendario</div><h2 style="text-transform:capitalize">'+mName+'</h2></div><button id="mn" aria-label="Mes siguiente">›</button></div>';
  h+='<div class="stats"><div class="stat"><span class="num">'+(planM/60).toFixed(1)+' h</span><span class="lbl">Planificado</span></div><div class="stat"><span class="num">'+(doneM/60).toFixed(1)+' h</span><span class="lbl">Hecho</span></div><div class="stat"><span class="num">'+(planM?Math.round(doneM/planM*100):0)+'%</span><span class="lbl">Cumplido</span></div></div>';
  h+='<section class="card"><div class="mes-head">'+DOW.map(d=>'<span>'+d+'</span>').join("")+'</div><div class="mes-grid">'+cells+'</div>';
  h+='<div class="mleg" style="margin-top:12px"><span><i style="background:rgba(31,95,69,.5)"></i>Z2 / fondo</span><span><i style="background:rgba(214,176,74,.7)"></i>Tempo / sweet spot</span><span><i style="background:rgba(200,100,28,.6)"></i>Umbral, test o fuerza</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Descanso</span><span>✓ hecho</span></div></section></div>';
  $view.innerHTML=h;
  const shift=n=>{const d=parse(first);d.setMonth(d.getMonth()+n);cur=fmt(d);render()};
  document.getElementById("mp").onclick=()=>shift(-1);
  document.getElementById("mn").onclick=()=>shift(1);
  $view.querySelectorAll(".md").forEach(b=>b.onclick=()=>{cur=b.dataset.k;setView("hoy")});
}

async function syncIV(auto){
  if(!IV.id||!IV.key){ if(!auto){ syncNote="Añade tu ID y clave en Semana → intervals.icu."; render(); } return; }
  syncNote="Sincronizando…"; if(!auto) render();
  try{
    const oldest=addDays(todayKey(),-14), newest=addDays(todayKey(),1);
    const r=await fetch("https://intervals.icu/api/v1/athlete/"+encodeURIComponent(IV.id)+"/activities?oldest="+oldest+"&newest="+newest,{headers:{"Authorization":"Basic "+btoa("API_KEY:"+IV.key)}});
    if(!r.ok) throw new Error("http "+r.status);
    const list=await r.json();
    let n=0;
    list.filter(a=>/ride/i.test(a.type||"")).forEach(a=>{
      const k=(a.start_date_local||"").slice(0,10); if(!k) return;
      const mins=Math.round((a.moving_time||a.elapsed_time||0)/60);
      const w=Math.round(a.icu_weighted_avg_watts||a.average_watts||0);
      const L=getLog(k), patch={done:true};
      if(mins>0 && !(L.min>0)) patch.min=mins;
      if(w>0 && !L.np) patch.np=w;
      setLog(k,patch); n++;
    });
    syncNote="Sincronizado: "+n+" salidas en bici · "+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  }catch(e){ syncNote=(e.message==="http 401"||e.message==="http 403")?"Clave o ID incorrectos.":"No se pudo sincronizar. Revisa la conexión."; }
  render();
}

function render(){
  const ph = phaseOf(todayKey());
  document.getElementById("phasePill").textContent = ph.name;
  document.getElementById("daysLeft").textContent = Math.max(0,diffDays(todayKey(),RACE));
  ({hoy:renderHoy,semana:renderSemana,fuerza:renderFuerza,progreso:renderProgreso,mes:renderMes})[view]();
}
function setView(v){view=v;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v?"true":"false"));render();window.scrollTo(0,0)}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setView(b.dataset.v));

// ---------- carga local inmediata ----------
(function loadLocal(){
  const s=lsGet("ep-settings"); if(s) settings=Object.assign({},DEFAULT_SET,migrate(Object.assign({},s)));
  loadIV();
  (lsGet("ep-index")||[]).forEach(id=>{const v=lsGet("ep-"+id); if(v) logs[id]=v;});
})();
render();
flash("Guardado en este teléfono");
if(IV.id&&IV.key) syncIV(true);

// ---------- intervals.icu (opcional) ----------
function loadIV(){ try{ const v=JSON.parse(localStorage.getItem("ep-iv")||"null"); if(v){IV.id=v.id||"";IV.key=v.key||"";} }catch(e){} }
function saveIV(id,key){ IV.id=id.trim(); IV.key=key.trim(); try{localStorage.setItem("ep-iv",JSON.stringify({id:IV.id,key:IV.key}))}catch(e){} }
async function sendToIntervals(k){
  const p=planFor(k), txt=workoutText(p);
  if(!IV.id||!IV.key) throw new Error("config");
  const r=await fetch("https://intervals.icu/api/v1/athlete/"+encodeURIComponent(IV.id)+"/events",{
    method:"POST",
    headers:{"Authorization":"Basic "+btoa("API_KEY:"+IV.key),"Content-Type":"application/json"},
    body:JSON.stringify({category:"WORKOUT",type:"Ride",start_date_local:k+"T07:00:00",name:p.t,description:txt})
  });
  if(!r.ok) throw new Error("http "+r.status);
  return r.json();
}
})();
